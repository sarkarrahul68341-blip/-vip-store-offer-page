<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Content Store - Exclusive Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #131b2e;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid #1f293d;
            text-align: center;
        }
        .banner-container {
            width: 100%;
            background: #1a233a;
            padding: 10px;
        }
        .banner-container img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }
        .content {
            padding: 24px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #f3f4f6;
        }
        .price-tag {
            font-size: 28px;
            font-weight: bold;
            color: #10b981;
            margin: 15px 0;
        }
        p {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }
        .footer-note {
            margin-top: 15px;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Banner Image Section (1.png) -->
        <div class="banner-container">
            <img src="1.png" alt="VIP Store Banner">
        </div>

        <div class="content">
            <h1>Exclusive VIP Access</h1>
            <div class="price-tag">₹99 Only</div>
            <p>Get instant access to our premium collection, high-quality media packs, and daily updates directly via our bot.</p>
            
            <!-- Telegram Bot CTA Button -->
            <a href="https://t.me/ViralcontentVIP1_bot" target="_blank" class="btn">Join VIP Bot Now</a>
            
            <div class="footer-note">Secure & Instant Access via Telegram</div>
        </div>
    </div>

</body>
</html>

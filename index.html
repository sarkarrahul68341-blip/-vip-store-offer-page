            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .banner-container {
            background: linear-gradient(135deg, #09061d, #1c143f, #110d2c);
            border: 2px solid rgba(6, 182, 212, 0.4);
            border-radius: 20px;
            padding: 25px 20px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }
        .top-badge {
            font-size: 11px;
            font-weight: 700;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 21px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 4px;
            letter-spacing: 0.5px;

        .sub-title {

            font-weight: 800;

        }
        .desc {
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .content-flex {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            align-items: center;
        }
        .video-box {
            flex: 1.2;
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid rgba(56, 189, 248, 0.5);
            border-radius: 12px;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }
        .thumb {
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899);
            aspect-ratio: 16/10;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .thumb::after {
            content: '▶';
            font-size: 8px;
            color: #ffffff;
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
        }
        .features-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .feature-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding: 7px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            color: #f8fafc;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* Exact Banner Style Price Box Matching Reference */
        .price-banner {
            background: linear-gradient(90deg, #1e1b4b, #31103f, #1e1b4b);
            border: 2px solid #ec4899;
            border-radius: 50px;
            padding: 10px 20px;
            margin-bottom: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
        }
        .old-price {
            font-size: 18px;
            color: #cbd5e1;
            text-decoration: line-through;
            font-weight: 700;
        }
        .new-price {
            font-size: 26px;
            color: #facc15;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(250,204,21,0.6);
        }
        .download-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            padding: 15px;
            border-radius: 14px;
            text-decoration: none;
            box-shadow: 0 6px 25px rgba(236, 72, 153, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }
        .download-btn:active {
            transform: scale(0.98);

        .footer-icons {
            display: flex;
            justify-content: space-around;
            font-size: 9px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.1);

</head>

</html>

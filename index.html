<!DOCTYPE html>
<html lang="en">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #131b2e;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 2px solid #f59e0b;
        }

        .header-section {
            text-align: center;
            margin-bottom: 15px;
        }

        .header-section h1 {
            font-size: 22px;
            font-weight: 800;
            color: #fbbf24;
            text-transform: uppercase;
            line-height: 1.2;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .header-section p {
            font-size: 12px;
            color: #9ca3af;
        }

        /* Golden Glowing Frame for Video Grid */
        .golden-frame {
            border: 3px solid #f59e0b;
            border-radius: 14px;
            padding: 8px;
            background: rgba(20, 15, 5, 0.6);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            margin-bottom: 15px;
        }

        /* 10 Boxes Grid Layout (2 columns x 5 rows) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .video-box {
            background: #000000;
            border-radius: 8px;
            aspect-ratio: 16/9;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(245, 158, 11, 0.3);
            overflow: hidden;
        }

        /* Red Play Button */
        .play-btn {
            width: 36px;
            height: 36px;
            background: #ff0000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(255, 0, 0, 0.6);
        }

        .play-btn::after {
            content: '';
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 12px solid #ffffff;
            margin-left: 2px;
        }

        /* Bottom Playback Bar inside each box */
        .playback-bar {
            position: absolute;
            bottom: 4px;
            left: 6px;
            right: 6px;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }

        .playback-progress {
            width: 30%;
            height: 100%;
            background: #ff0000;
            border-radius: 2px;
        }

        .download-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            margin-bottom: 10px;
        }

        .footer-secure {
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
        }
    </style>
</head>
